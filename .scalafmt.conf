version = "3.9.10"
runner.dialect = scala3
maxColumn = 100

# The build compiles with -no-indent, so braces stay. Nothing here may rewrite
# to significant indentation.
rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.removeOptionalBraces = no

align.preset = more
docstrings.style = SpaceAsterisk
docstrings.wrap = no

project.excludeFilters = ["target/"]
